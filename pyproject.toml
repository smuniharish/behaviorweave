[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[project]
name = "behaviorweave"
version = "1.1.0"
description = "Deterministic behavioral policies and interventions for LangGraph and LangChain agents."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "S MUNI HARISH", email = "samamuniharish@gmail.com" },
]
keywords = [
  "agents",
  "agxai",
  "ai-safety",
  "guardrails",
  "intervention",
  "langchain",
  "langgraph",
  "policy",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "agxai[langgraph]>=1.0.2,<2",
  "langchain>=1.4.9,<2",
  "langchain-core>=1.7.6,<2",
  "langgraph>=1.2.20,<2",
]

[project.urls]
Homepage = "https://github.com/smuniharish/behaviorweave"
Documentation = "https://behaviorweave.readthedocs.io/"
Changelog = "https://github.com/smuniharish/behaviorweave/blob/master/CHANGELOG.md"
Issues = "https://github.com/smuniharish/behaviorweave/issues"
Repository = "https://github.com/smuniharish/behaviorweave"

[dependency-groups]
test = [
  "agxai[otel]>=1.0.2,<2",
  "hypothesis>=6.170.15",
  "langchain[mcp]>=1.4.9,<2",
  "mcp>=2.3.0,<3",
  "pytest>=9.2.0",
  "pytest-asyncio>=1.4.1.post1",
  "pytest-cov>=7.1.0",
  "skills-ref>=0.1.1,<1",
]
lint = ["ruff>=0.17.4"]
types = ["pyrefly>=1.4.1"]
docs = [
  "mkdocstrings-python>=2.0.10,<3",
  "zensical>=0.1.0,<0.2",
]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "types" },
]
examples = [
  "agxai[otel]>=1.0.2,<2",
  "deepagents>=0.7.34,<1",
  "langchain[mcp]>=1.4.9,<2",
  "langchain-openai>=1.7.4,<2",
  "langgraph-checkpoint-postgres>=3.2.0,<4",
  "langgraph-swarm>=0.1.0,<1",
  "mcp>=2.3.0,<3",
  "opentelemetry-exporter-otlp-proto-http>=1.45.2,<2",
  "psycopg[binary,pool]>=3.3.8,<4",
  "psycopg-pool>=3.3.3,<4",
  "redis>=8.1.0,<9",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
source-include = [
  "tests/**", "examples/**", "docs/**", "diagrams/**", "scripts/**",
  "behaviorweave-skills/**", "zensical.toml", "skills.sh.json", "uv.lock",
  "CHANGELOG.md", "CONTRIBUTING.md", "CODE_OF_CONDUCT.md", "SECURITY.md",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "A",     # builtin shadowing
  "ARG",   # unused arguments
  "ASYNC", # async pitfalls
  "B",     # bugbear
  "C4",    # comprehensions
  "D",     # docstrings (Google convention)
  "DTZ",   # timezone-aware datetimes
  "E",     # pycodestyle errors
  "ERA",   # commented-out code
  "F",     # pyflakes
  "I",     # import order
  "N",     # naming
  "PERF",  # performance anti-patterns
  "PIE",   # misc. lints
  "PT",    # pytest style
  "PTH",   # pathlib
  "RUF",   # ruff-specific
  "S",     # security (bandit)
  "SIM",   # simplifications
  "T20",   # print statements
  "TC",    # type-checking imports
  "UP",    # pyupgrade
  "W",     # pycodestyle warnings
]
ignore = [
  "D105", # magic methods document themselves
  "D107", # __init__ is documented on the class
  # Public dataclasses and framework-introspected signatures must resolve their annotations at
  # runtime (typing.get_type_hints, pydantic, LangChain tools), so annotation-only imports of
  # standard-library and first-party types stay at runtime.
  "TC001",
  "TC003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests and examples define LangChain tools and LangGraph nodes whose signatures the frameworks
# inspect at runtime, and examples print their results.
"tests/**" = ["ARG", "D", "S101", "TC"]
"examples/**" = ["D103", "S101", "T20", "TC"]
"scripts/**" = ["T20"]
"behaviorweave-skills/**" = ["ARG", "D103", "S101", "T20", "TC"]

[tool.ruff.lint.isort]
known-first-party = [
  "behaviorweave",
  "common",
  "postgres_state_store",
  "redis_state_store",
  "support",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# langsmith (a LangChain dependency) registers a pytest plugin this suite does not use.
addopts = ["-ra", "--strict-markers", "--strict-config", "-p", "no:langsmith_plugin"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "examples: runs an example script offline with a scripted chat model",
  "live: runs an example against a real model endpoint (needs OPENAI_API_KEY and BEHAVIORWEAVE_MODEL)",
  "benchmark: generous performance budgets that catch order-of-magnitude regressions",
]
filterwarnings = [
  "error",
  "ignore::langchain_core._api.beta_decorator.LangChainBetaWarning",
  # langsmith 0.14.17 emits an import-time warning on Python 3.14+.
  "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith",
  # MCP's key_value dependency triggers a runtime annotation warning on Python 3.15.
  "ignore:.*key_value.*isn't explicitly decorated:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["behaviorweave"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  '^\s*\.\.\.$',
]

[tool.pyrefly]
project-includes = [
  "src/**/*.py",
  "tests/**/*.py",
  "examples/**/*.py",
  "scripts/**/*.py",
  "behaviorweave-skills/**/*.py",
]
search-path = ["src", "examples", "tests"]

# Pyrefly does not yet match LangGraph's StateGraph bound against TypedDict classes.
[[tool.pyrefly.sub-config]]
matches = "examples/**"
errors = { bad-specialization = false }

[[tool.pyrefly.sub-config]]
matches = "tests/**"
errors = { bad-specialization = false }

[[tool.pyrefly.sub-config]]
matches = "behaviorweave-skills/**"
errors = { bad-specialization = false }
