name: Bug report
description: Report a problem with BehaviorWeave
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more of this form you fill in, the
        faster the problem can be reproduced and fixed. Never include API keys, credentials,
        or private data.

  - type: input
    id: version
    attributes:
      label: BehaviorWeave version
      description: Output of `python -c "import behaviorweave; print(behaviorweave.__version__)"`.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python --version`.
      placeholder: "3.13.5"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: >
        A minimal, self-contained script that reproduces the issue: the policies, the events
        (with fixed timestamps when cooldowns matter), and the decision you received. For agent
        issues, the integration you use (BehaviorWeaveMiddleware, an adapter, or langgraph-xai).
      render: python
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Relevant log output or traceback
      description: Paste any error output. It is rendered as a code block automatically.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: >
        Anything else that might be relevant, such as your operating system and your LangChain,
        LangGraph, and langgraph-xai versions.
