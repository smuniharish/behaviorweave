name: Feature request
description: Suggest an idea or capability for BehaviorWeave
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. BehaviorWeave is a deterministic behavioral policy layer
        for LangChain and LangGraph agents; it is not an agent framework, an observability
        backend, or a model-based classifier. Requests about detecting runtime behavior and
        returning explainable interventions fit best.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the agent behavior, use case, or limitation you ran into.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >
        What would you like to see added or changed? If you have an idea for the API shape
        (a new pattern, policy option, integration, or adapter method), sketch it here.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches or workarounds you have tried.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, references, or examples that motivate this request.
