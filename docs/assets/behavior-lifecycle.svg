<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">BehaviorWeave event lifecycle</title>
  <desc id="desc">LangGraph or LangChain flows through langgraph-xai context, an integration adapter, BehaviorWeave event and fingerprint processing, pattern and policy evaluation, then an intervention decision for the host runtime.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4051b5"/>
    </marker>
    <style>
      .box { fill: #f7f8ff; stroke: #4051b5; stroke-width: 2; rx: 9; }
      .accent { fill: #e8eaf6; }
      .label { fill: #263238; font: 600 17px Arial, sans-serif; text-anchor: middle; }
      .small { fill: #455a64; font: 13px Arial, sans-serif; text-anchor: middle; }
      .line { stroke: #4051b5; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="260" fill="#ffffff"/>
  <rect class="box accent" x="20" y="82" width="130" height="76"/>
  <text class="label" x="85" y="113">LangGraph</text><text class="small" x="85" y="136">or LangChain</text>
  <line class="line" x1="150" y1="120" x2="184" y2="120"/>
  <rect class="box" x="184" y="82" width="130" height="76"/>
  <text class="label" x="249" y="113">langgraph-xai</text><text class="small" x="249" y="136">context</text>
  <line class="line" x1="314" y1="120" x2="348" y2="120"/>
  <rect class="box" x="348" y="82" width="130" height="76"/>
  <text class="label" x="413" y="113">Integration</text><text class="small" x="413" y="136">adapter</text>
  <line class="line" x1="478" y1="120" x2="512" y2="120"/>
  <rect class="box accent" x="512" y="82" width="130" height="76"/>
  <text class="label" x="577" y="113">BehaviorEvent</text><text class="small" x="577" y="136">fingerprint</text>
  <line class="line" x1="642" y1="120" x2="676" y2="120"/>
  <rect class="box" x="676" y="82" width="130" height="76"/>
  <text class="label" x="741" y="108">Patterns</text><text class="small" x="741" y="132">BehaviorState</text>
  <line class="line" x1="806" y1="120" x2="840" y2="120"/>
  <rect class="box" x="840" y="82" width="130" height="76"/>
  <text class="label" x="905" y="108">PolicyEngine</text><text class="small" x="905" y="132">threshold/cooldown</text>
  <line class="line" x1="970" y1="120" x2="1004" y2="120"/>
  <rect class="box accent" x="1004" y="82" width="176" height="76"/>
  <text class="label" x="1092" y="108">InterventionDecision</text><text class="small" x="1092" y="132">host runtime applies</text>
  <text class="small" x="600" y="218">Observable execution data only — BehaviorWeave never records private model reasoning.</text>
</svg>
